<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 230" fill="none">
  <defs>
    <!-- Drop Shadow for the Hanging Pennant Badge -->
    <filter id="pennantShadow" x="-10%" y="0%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Hanging White Pennant / Banner Card with Pointed Bottom -->
  <path 
    d="M 4 0 L 236 0 L 236 175 L 120 220 L 4 175 Z" 
    fill="#FFFFFF" 
    filter="url(#pennantShadow)"
    stroke="#E2E8F0"
    stroke-width="1.5"
  />

  <!-- Top Subtle Gold Accent Line at Top Edge -->
  <line x1="4" y1="1" x2="236" y2="1" stroke="#FFB800" stroke-width="3" />

  <!-- ============================================== -->
  <!-- 1. ICON / EMBLEM: House + Skyscraper Tower      -->
  <!-- ============================================== -->
  <g transform="translate(120, 48) scale(0.24)">
    <!-- Centered at x=0, y=0 inside group -->
    <!-- Tower Body (Navy with Gold Outline) -->
    <path 
      d="M -10 -40 L -10 -145 L 60 -168 L 60 120 L -10 120 Z" 
      fill="#1B2653" 
      stroke="#FFB800" 
      stroke-width="12" 
      stroke-linejoin="round"
    />
    
    <!-- House Body & Gable Roof (Navy with Gold Outline) -->
    <path 
      d="M -125 0 L -40 -90 L 20 -35 L 20 120 L -125 120 Z" 
      fill="#1B2653" 
      stroke="#FFB800" 
      stroke-width="12" 
      stroke-linejoin="round"
    />

    <!-- Overlapping Inner Navy Fill -->
    <path 
      d="M -120 0 L -40 -84 L 54 -160 L 54 114 L -120 114 Z" 
      fill="#1B2653" 
    />

    <!-- Overhanging Gable Roof Trim -->
    <path 
      d="M -145 15 L -40 -95 L 25 -38" 
      fill="none" 
      stroke="#FFB800" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Tower Slanted Roof Peak Trim -->
    <path 
      d="M -15 -144 L 65 -170" 
      fill="none" 
      stroke="#FFB800" 
      stroke-width="16" 
      stroke-linecap="round"
    />

    <!-- Curved Swoosh Foundation Beam -->
    <path 
      d="M -150 140 Q -30 100 100 112 L 100 118 Q -30 106 -150 146 Z" 
      fill="#FFB800"
    />

    <!-- 4-Pane Square Window in House -->
    <rect x="-90" y="10" width="22" height="22" rx="2" fill="#FFB800" />
    <rect x="-62" y="10" width="22" height="22" rx="2" fill="#FFB800" />
    <rect x="-90" y="38" width="22" height="22" rx="2" fill="#FFB800" />
    <rect x="-62" y="38" width="22" height="22" rx="2" fill="#FFB800" />

    <!-- 4 Vertical Windows in Tower -->
    <rect x="15" y="-125" width="22" height="30" rx="3" fill="#FFB800" transform="skewY(-6)" />
    <rect x="15" y="-82" width="22" height="30" rx="3" fill="#FFB800" transform="skewY(-6)" />
    <rect x="15" y="-39" width="22" height="30" rx="3" fill="#FFB800" transform="skewY(-6)" />
    <rect x="15" y="4" width="22" height="30" rx="3" fill="#FFB800" transform="skewY(-6)" />
  </g>

  <!-- ============================================== -->
  <!-- 2. TYPOGRAPHY: Banashankari (Serif Luxury)      -->
  <!-- ============================================== -->
  <text 
    x="120" 
    y="108" 
    text-anchor="middle" 
    fill="#1B2653" 
    font-family="'Playfair Display', Georgia, serif" 
    font-weight="700" 
    font-size="24.5" 
    letter-spacing="-0.3"
  >
    Banashankari
  </text>
  
  <!-- Registered Circle Trademark Symbol -->
  <circle cx="211" cy="94" r="4.5" fill="none" stroke="#1B2653" stroke-width="0.8" />
  <text x="211" y="96.5" text-anchor="middle" font-size="5.5" font-family="system-ui, sans-serif" font-weight="700" fill="#1B2653">R</text>

  <!-- ============================================== -->
  <!-- 3. SUBTITLE: E N T E R P R I S E S             -->
  <!-- ============================================== -->
  <text 
    x="120" 
    y="126" 
    text-anchor="middle" 
    fill="#1B2653" 
    font-family="'Outfit', system-ui, sans-serif" 
    font-weight="800" 
    font-size="12" 
    letter-spacing="5"
  >
    ENTERPRISES
  </text>

  <!-- ============================================== -->
  <!-- 4. BOTTOM PARALLELOGRAM RIBBON: SLANTED BANNER -->
  <!-- ============================================== -->
  <path 
    d="M 18 140 L 222 140 L 210 162 L 30 162 Z" 
    fill="#1B2653" 
  />

  <text 
    x="120" 
    y="154.5" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Outfit', system-ui, sans-serif" 
    font-weight="800" 
    font-size="9" 
    letter-spacing="1.8"
  >
    REAL ESTATE &amp; CONSTRUCTION
  </text>
</svg>
